name: Tests & Quality

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  REDIS_HOST: 127.0.0.1

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies, ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services: &services
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -uroot -psecret -e 'select 1' test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: test
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      pgsql:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
        database: [sqlite, mysql, mariadb, pgsql]

    env:
      DB_CONNECTION: ${{ matrix.database }}
      REDIS_CLIENT: phpredis
      SUITE: Unit,Integration
      DEPENDENCIES: ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies }}

      - name: Run Unit and Integration suites
        id: suite
        run: vendor/bin/phpunit --no-coverage --testsuite "$SUITE"

      - uses: ./.github/actions/record
        if: always() && steps.suite.outcome != 'skipped'
        with:
          kind: compatibility
          outcome: ${{ steps.suite.outcome }}
          name: compatibility-${{ matrix.php }}-${{ matrix.dependencies }}-${{ matrix.database }}
          database-container: ${{ job.services[matrix.database].id }}
          redis-container: ${{ job.services.redis.id }}

  suites:
    name: ${{ matrix.suite }} on ${{ matrix.database }} with ${{ matrix.redis-client }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services

    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: Integration, database: sqlite, redis-client: predis }
          - { suite: Integration, database: mysql, redis-client: predis }
          - { suite: Integration, database: mariadb, redis-client: predis }
          - { suite: Integration, database: pgsql, redis-client: predis }
          - { suite: Fuzz, database: sqlite, redis-client: phpredis }
          - { suite: Fuzz, database: sqlite, redis-client: predis }
          - { suite: Fuzz, database: mysql, redis-client: phpredis }
          - { suite: Fuzz, database: mysql, redis-client: predis }
          - { suite: Fuzz, database: pgsql, redis-client: phpredis }
          - { suite: Fuzz, database: pgsql, redis-client: predis }
          - { suite: Concurrency, database: mysql, redis-client: phpredis }
          - { suite: Concurrency, database: mysql, redis-client: predis }
          - { suite: Concurrency, database: pgsql, redis-client: phpredis }
          - { suite: Concurrency, database: pgsql, redis-client: predis }

    env:
      DB_CONNECTION: ${{ matrix.database }}
      REDIS_CLIENT: ${{ matrix.redis-client }}
      SUITE: ${{ matrix.suite }}
      MODEL_CACHE_FUZZ_ITERATIONS: ${{ matrix.suite == 'Fuzz' && '3000' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      - name: Run ${{ matrix.suite }} suite
        id: suite
        run: vendor/bin/phpunit --no-coverage --testsuite "$SUITE"

      - uses: ./.github/actions/record
        if: always() && steps.suite.outcome != 'skipped'
        with:
          kind: suite
          outcome: ${{ steps.suite.outcome }}
          name: suite-${{ matrix.suite }}-${{ matrix.database }}-${{ matrix.redis-client }}
          database-container: ${{ job.services[matrix.database].id }}
          redis-container: ${{ job.services.redis.id }}

  benchmark:
    name: Benchmark on ${{ matrix.database }} with ${{ matrix.redis-client }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services: *services

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, mariadb, pgsql]
        redis-client: [phpredis, predis]

    env:
      DB_CONNECTION: ${{ matrix.database }}
      REDIS_CLIENT: ${{ matrix.redis-client }}
      MODEL_CACHE_BENCHMARK_REPORT: ${{ github.workspace }}/benchmark.json

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      - name: Run benchmark
        id: suite
        run: vendor/bin/phpunit --no-coverage tests/Benchmark

      - uses: ./.github/actions/record
        if: always() && steps.suite.outcome != 'skipped'
        with:
          kind: benchmark
          outcome: ${{ steps.suite.outcome }}
          name: benchmark-${{ matrix.database }}-${{ matrix.redis-client }}
          database-container: ${{ job.services[matrix.database].id }}
          redis-container: ${{ job.services.redis.id }}
          benchmark: ${{ steps.suite.outcome == 'success' && env.MODEL_CACHE_BENCHMARK_REPORT || '' }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Check shell scripts
        run: shellcheck .github/scripts/*.sh

  report:
    needs: [compatibility, suites, benchmark, quality]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Render report
        run: php .github/scripts/render-report.php --results="$RUNNER_TEMP/results" --run-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to the README
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/master'
          && needs.compatibility.result == 'success'
          && needs.suites.result == 'success'
          && needs.benchmark.result == 'success'
          && needs.quality.result == 'success'
        run: |
          php .github/scripts/render-report.php --results="$RUNNER_TEMP/results" --run-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --readme=README.md > /dev/null
          if git diff --quiet -- README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update the generated compatibility matrix and benchmarks' -- README.md
          git pull --rebase origin master
          git push origin HEAD:master

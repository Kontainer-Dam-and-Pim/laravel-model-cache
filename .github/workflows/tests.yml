name: Tests & Quality

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  REDIS_HOST: 127.0.0.1

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies, ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services: &services
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -uroot -psecret -e 'select 1' test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: test
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      pgsql:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
        database: [sqlite, mysql, mariadb, pgsql]

    env:
      DB_CONNECTION: ${{ matrix.database }}
      REDIS_CLIENT: phpredis
      SUITE: Unit,Integration
      DEPENDENCIES: ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies }}

      - uses: ./.github/actions/disposable-database
        with:
          database: ${{ matrix.database }}
          container: ${{ matrix.database != 'sqlite' && job.services[matrix.database].id || '' }}

      - name: Run Unit and Integration suites
        id: suite
        run: vendor/bin/phpunit --no-coverage --testsuite "$SUITE"

      - uses: ./.github/actions/record
        if: always() && steps.suite.outcome != 'skipped'
        with:
          kind: compatibility
          outcome: ${{ steps.suite.outcome }}
          name: compatibility-${{ matrix.php }}-${{ matrix.dependencies }}-${{ matrix.database }}
          database-container: ${{ job.services[matrix.database].id }}
          redis-container: ${{ job.services.redis.id }}

  suites:
    name: ${{ matrix.suite }} on ${{ matrix.database }} with ${{ matrix.redis-client }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services

    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: Integration, database: sqlite, redis-client: predis }
          - { suite: Integration, database: mysql, redis-client: predis }
          - { suite: Integration, database: mariadb, redis-client: predis }
          - { suite: Integration, database: pgsql, redis-client: predis }
          - { suite: Fuzz, database: sqlite, redis-client: phpredis }
          - { suite: Fuzz, database: sqlite, redis-client: predis }
          - { suite: Fuzz, database: mysql, redis-client: phpredis }
          - { suite: Fuzz, database: mysql, redis-client: predis }
          - { suite: Fuzz, database: pgsql, redis-client: phpredis }
          - { suite: Fuzz, database: pgsql, redis-client: predis }
          - { suite: Concurrency, database: mysql, redis-client: phpredis }
          - { suite: Concurrency, database: mysql, redis-client: predis }
          - { suite: Concurrency, database: pgsql, redis-client: phpredis }
          - { suite: Concurrency, database: pgsql, redis-client: predis }

    env:
      DB_CONNECTION: ${{ matrix.database }}
      REDIS_CLIENT: ${{ matrix.redis-client }}
      SUITE: ${{ matrix.suite }}
      MODEL_CACHE_FUZZ_ITERATIONS: ${{ matrix.suite == 'Fuzz' && '3000' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      - uses: ./.github/actions/disposable-database
        with:
          database: ${{ matrix.database }}
          container: ${{ matrix.database != 'sqlite' && job.services[matrix.database].id || '' }}

      - name: Run ${{ matrix.suite }} suite
        id: suite
        run: vendor/bin/phpunit --no-coverage --testsuite "$SUITE"

      - uses: ./.github/actions/record
        if: always() && steps.suite.outcome != 'skipped'
        with:
          kind: suite
          outcome: ${{ steps.suite.outcome }}
          name: suite-${{ matrix.suite }}-${{ matrix.database }}-${{ matrix.redis-client }}
          database-container: ${{ job.services[matrix.database].id }}
          redis-container: ${{ job.services.redis.id }}

  coverage:
    name: Coverage on ${{ matrix.database }} with ${{ matrix.redis-client }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services

    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: sqlite, redis-client: phpredis }
          - { database: mysql, redis-client: phpredis }
          - { database: mariadb, redis-client: phpredis }
          - { database: pgsql, redis-client: phpredis }
          - { database: sqlite, redis-client: predis }

    env:
      DB_CONNECTION: ${{ matrix.database }}
      REDIS_CLIENT: ${{ matrix.redis-client }}
      COVERAGE_FILE: ${{ github.workspace }}/coverage-${{ matrix.database }}-${{ matrix.redis-client }}.cov

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'
          coverage: pcov

      - uses: ./.github/actions/disposable-database
        with:
          database: ${{ matrix.database }}
          container: ${{ matrix.database != 'sqlite' && job.services[matrix.database].id || '' }}

      - name: Run Unit and Integration suites with coverage
        run: vendor/bin/phpunit --testsuite Unit,Integration --coverage-php "$COVERAGE_FILE"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.database }}-${{ matrix.redis-client }}
          path: ${{ env.COVERAGE_FILE }}
          retention-days: 1

  coverage-gate:
    name: Line coverage is 100%
    needs: coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      - name: Merge coverage of every database and Redis client
        run: php -d memory_limit=-1 vendor/bin/phpcov merge --clover "$RUNNER_TEMP/clover.xml" "$RUNNER_TEMP/coverage"

      - name: Fail on any uncovered line
        run: php .github/scripts/check-coverage.php --clover="$RUNNER_TEMP/clover.xml" --badge="$RUNNER_TEMP/coverage.json"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: Benchmark on ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, mariadb, pgsql]

    env:
      DB_CONNECTION: ${{ matrix.database }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      - name: Run benchmark with phpredis
        id: phpredis
        env:
          REDIS_CLIENT: phpredis
          MODEL_CACHE_BENCHMARK_REPORT: ${{ runner.temp }}/benchmark-phpredis.json
        run: vendor/bin/phpunit --no-coverage tests/Benchmark

      - name: Run benchmark with Predis on the same runner
        id: predis
        if: always() && steps.phpredis.outcome != 'skipped'
        env:
          REDIS_CLIENT: predis
          MODEL_CACHE_BENCHMARK_REPORT: ${{ runner.temp }}/benchmark-predis.json
        run: vendor/bin/phpunit --no-coverage tests/Benchmark

      - uses: ./.github/actions/record
        if: always() && steps.phpredis.outcome != 'skipped'
        env:
          REDIS_CLIENT: phpredis
        with:
          kind: benchmark
          outcome: ${{ steps.phpredis.outcome }}
          name: benchmark-${{ matrix.database }}-phpredis
          database-container: ${{ job.services[matrix.database].id }}
          redis-container: ${{ job.services.redis.id }}
          benchmark: ${{ steps.phpredis.outcome == 'success' && format('{0}/benchmark-phpredis.json', runner.temp) || '' }}

      - uses: ./.github/actions/record
        if: always() && steps.predis.outcome != 'skipped'
        env:
          REDIS_CLIENT: predis
        with:
          kind: benchmark
          outcome: ${{ steps.predis.outcome }}
          name: benchmark-${{ matrix.database }}-predis
          database-container: ${{ job.services[matrix.database].id }}
          redis-container: ${{ job.services.redis.id }}
          benchmark: ${{ steps.predis.outcome == 'success' && format('{0}/benchmark-predis.json', runner.temp) || '' }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Check shell scripts
        run: shellcheck .github/scripts/*.sh

  report:
    needs: [compatibility, suites, coverage-gate, benchmark, quality]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: needs.coverage-gate.result == 'success'
        with:
          name: coverage-badge
          path: .github/badges

      - name: Render report
        run: php .github/scripts/render-report.php --results="$RUNNER_TEMP/results" --run-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to the README
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/master'
          && needs.compatibility.result == 'success'
          && needs.suites.result == 'success'
          && needs.coverage-gate.result == 'success'
          && needs.benchmark.result == 'success'
          && needs.quality.result == 'success'
        run: |
          php .github/scripts/render-report.php --results="$RUNNER_TEMP/results" --run-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --readme=README.md --art=art > /dev/null
          generated=(README.md art/benchmarks-light.svg art/benchmarks-dark.svg .github/badges/coverage.json)
          if git diff --quiet -- "${generated[@]}"; then
            echo "README, charts and badges already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update the generated compatibility matrix, benchmarks and coverage badge' -- "${generated[@]}"
          git pull --rebase origin master
          git push origin HEAD:master
